name: Probe license registries
# Read-only: asks each state open-data portal what its contractor-license
# datasets look like, because the build container cannot reach them. Pressed
# by hand; prints JSON and keeps it as an artifact.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node app/scripts/probe-license-sources.mjs | tee probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: license-probe
          path: probe.txt
