# The "not available yet" Worker (subsub-unclaimed): the page a branded
# *.subsub.work address shows before it is live. See app/worker-unclaimed.js.
#
# It answers only once two things are set in Cloudflare by hand, both
# reversible: a proxied wildcard DNS record (*) and the route
# *.subsub.work/* pointing at this Worker. Until then deploying it changes
# nothing anybody sees.
name: Deploy not-available page

on:
  workflow_dispatch:
  push:
    paths:
      - "app/worker-unclaimed.js"
      - "app/wrangler.unclaimed.toml"
      - "app/shared/unclaimed.js"
      - "app/worker/hostnames.js"
      - ".github/workflows/deploy-unclaimed.yml"

concurrency:
  group: deploy-unclaimed
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check the credentials are set
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ASKED_FOR: ${{ github.event_name }}
        run: |
          missing=""
          [ -n "$TOKEN" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ "$ASKED_FOR" = "workflow_dispatch" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi
          echo "::notice::Not deploying:$missing not set. Checking anyway."

      - name: Install
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Its own checks
        working-directory: app
        run: npm run test:unclaimed

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config=./wrangler.unclaimed.toml

      - name: Say what happened
        if: success()
        run: |
          if [ "${{ steps.creds.outputs.ready }}" = "true" ]; then
            echo "### subsub-unclaimed deployed from \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Checked, not deployed (credentials not set)" >> "$GITHUB_STEP_SUMMARY"
          fi
