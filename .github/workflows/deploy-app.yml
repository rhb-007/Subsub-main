# Deploy the customer app (app.subsub.work and every *.subsub.work).
#
# This is the third of three, and the reason it exists is the reason the
# console's workflow next door exists: something shipped SubSub that nobody
# here could see, press, or find the failure of.
#
# The API has deploy-api.yml. The console has deploy-admin.yml. The customer
# app -- the bundle every customer actually looks at -- had neither. It is a
# Cloudflare Pages project, `subsub-app`, wired straight to this repository on
# Cloudflare's side, so it builds on push with no record in the Actions tab.
# When it stops shipping, GitHub is green, the API deploys fine, and the only
# symptom is that the screens do not change. That is precisely what happened:
# a day of content changes went in, every deploy here reported success, and
# none of it reached anybody.
#
# A deploy nobody can press is a deploy nobody can fix. So this is a button:
#
#   Actions tab -> "Deploy customer app" -> Run workflow. Works from a phone.
#
# It needs the same four values deploy-admin.yml does -- CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID as repository secrets, plus VITE_SUPABASE_URL and
# VITE_SUPABASE_ANON_KEY as secrets OR variables. The token additionally needs
# "Account -> Cloudflare Pages -> Edit", which the Worker deploys do not use.
# Edit carries the read this workflow's last step does; if it ever does not,
# that step warns and the deploy still stands, because a missing report is not
# a failed deploy.
#
# ALWAYS THE ANON (publishable) KEY. Never service_role: this bundle is
# downloaded by every customer and anything in it is public.
#
# It ships on push now, and it did not start that way. A push trigger on a
# deploy path that has never once been watched run would ship to every customer
# on the strength of a guess about a project name, so the first two runs were
# pressed by hand.
#
# Run 1 went green, which established the project name and the token and not
# one thing more. Whether the upload went LIVE was read off the deploy output,
# and `wrangler pages deploy` prints the per-deployment `<hash>.pages.dev` URL
# for a production deploy and a preview alike -- so the only question that
# matters, did anybody see this, was handed to a test that cannot tell the two
# apart and answers confidently either way. `Where did it land` asks Cloudflare
# instead, and run 2 came back `production` on `claude/hello-24aree`, serving
# app.subsub.work and the three tenant subdomains. That is the condition the
# push trigger was waiting on: a trigger that ships previews is a button that
# reports success and changes nothing, which is the exact failure this file was
# written for.
#
# The paths are deploy-admin.yml's, because the two build from the same tree
# and differ only in VITE_BUILD. A path list that misses a file is a change
# that does not ship and says nothing about it -- the same silence, one
# directory further in -- so when the build starts reading something new, it
# goes here.
name: Deploy customer app

on:
  workflow_dispatch:
  push:
    paths:
      - "app/src/**"
      - "app/shared/**"
      - "app/public/**"
      - "app/index.html"
      - "app/vite.config.js"
      - "app/package.json"
      - "app/package-lock.json"
      - ".github/workflows/deploy-app.yml"

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Pressing Run workflow is asking for a deploy, so a missing credential
      # is a failure that names itself rather than a quiet no-op.
      - name: Check the credentials are set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Install
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      # Refuse rather than ship. An app built without these has no sign-in
      # configured, and deploying it to app.subsub.work would lock out every
      # customer at once behind a form that cannot work -- which reads as the
      # product being down, not as a missing repository value.
      - name: Check the build variables are set
        env:
          SUPA_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          SUPA_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          API_BASE: ${{ vars.VITE_API_BASE || secrets.VITE_API_BASE || 'https://api.subsub.work/api' }}
        run: |
          missing=""
          [ -n "$SUPA_URL" ] || missing="$missing VITE_SUPABASE_URL"
          [ -n "$SUPA_KEY" ] || missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing build value(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions, as"
            echo "secrets or variables. Use the ANON (publishable) key, never the"
            echo "service_role key -- this bundle is public."
            exit 1
          fi
          # A RELATIVE API BASE IS A DEAD APP, and it is the default.
          #
          # api.js falls back to "/api" so a dev build can let Vite proxy it.
          # The customer app in production is static files on Pages with no
          # proxy behind them, so "/api" hits the static site and 404s -- every
          # call, including sign-in, which is why it presents as "Couldn't
          # reach SubSub" rather than as anything to do with a build variable.
          # The console next door gets away with the same default because its
          # Worker forwards /api/* over a service binding; Pages has nothing to
          # forward with.
          case "$API_BASE" in
            https://*) ;;
            *)
              echo "::error::VITE_API_BASE must be absolute, got: $API_BASE"
              echo "A relative base makes every API call hit the static site."
              exit 1 ;;
          esac
          echo "API base: $API_BASE"

      # VITE_BUILD is deliberately UNSET. App.tsx reads
      #   VITE_BUILD === "platform" ? "platform" : "tenant"
      # so unset is the customer app. Setting it here would build the console.
      - name: Build the customer app
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE || secrets.VITE_API_BASE || 'https://api.subsub.work/api' }}
        run: npm run build

      # The mirror of the console's check, and it matters in the same way.
      # Both builds write to dist/ and only VITE_BUILD decides which is in
      # there, so it is proved AFTER the build rather than assumed from the
      # variable. Deploying the console to app.subsub.work would put a staff
      # sign-in in front of every customer.
      #
      # Two assertions, because absence alone is not proof: an empty or
      # half-written bundle would satisfy "no console string" perfectly well.
      - name: Check it is the customer app we built
        working-directory: app
        env:
          API_BASE: ${{ vars.VITE_API_BASE || secrets.VITE_API_BASE || 'https://api.subsub.work/api' }}
        run: |
          if grep -rqF "SubSub internal console" dist/assets/*.js; then
            echo "::error::The built bundle is the CONSOLE, not the customer app."
            echo "VITE_BUILD leaked in. Deploying this would put the staff sign-in"
            echo "in front of every customer."
            exit 1
          fi
          if ! grep -rqF "Powered by SubSub" dist/assets/*.js; then
            echo "::error::The built bundle does not look like the customer app."
            echo "The pasted application form's Powered by SubSub line is missing, so"
            echo "this is not a complete tenant build."
            exit 1
          fi
          # Proved from the ARTIFACT, not from the variable, for the reason the
          # console check above gives: both builds write to dist/ and what is
          # in there is the only thing that ships. A build variable that is set
          # and does not reach the bundle looks identical to one that does.
          #
          # This is the check that was missing when a deploy from here went out
          # with no VITE_API_BASE at all: green run, correct bundle, and every
          # API call pointed at a path that does not exist.
          if ! grep -rqF "$API_BASE" dist/assets/*.js; then
            echo "::error::The API base did not reach the bundle."
            echo "Expected to find $API_BASE in dist/assets. Without it every call"
            echo "falls back to the relative /api, which on Pages is the static"
            echo "site -- so the app builds, deploys, and cannot sign anybody in."
            exit 1
          fi
          echo "customer app built, talking to $API_BASE"

      - name: Deploy
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name=subsub-app \
            --branch="${{ github.ref_name }}" \
            --commit-dirty=true 2>&1 | tee /tmp/deploy.log
          url="$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' /tmp/deploy.log | tail -1)"
          echo "DEPLOY_URL=$url" >> "$GITHUB_ENV"

      # Ask Cloudflare, rather than reading the deploy output.
      #
      # `wrangler pages deploy` prints the immutable per-deployment URL --
      # https://<hash>.<project>.pages.dev -- for EVERY deployment, production
      # ones included, because that URL always exists. So "it printed a
      # pages.dev address" proves nothing at all, and the first version of this
      # workflow told whoever ran it to read exactly that and draw a conclusion
      # from it. A test that cannot distinguish the two cases is worse than no
      # test: it is answered confidently and wrongly.
      #
      # Only the project knows. `production_branch` is the one Pages serves the
      # custom domains from, and `latest_deployment.environment` is what this
      # deploy actually became. Both come off one authenticated read with the
      # token that just deployed, so a run that got far enough to deploy is far
      # enough to be told where it went.
      #
      # It does not FAIL on a preview. A preview deploy is a real, useful thing
      # -- it is how you look at a branch before it is live -- so this reports
      # rather than refuses, and names the one setting that changes it.
      - name: Where did it land
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          code=$(curl -sS -o /tmp/proj.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/subsub-app" \
            || echo 000)
          if [ "$code" != "200" ]; then
            echo "PAGES_LOOKUP=failed" >> "$GITHUB_ENV"
            echo "::warning::Could not read the Pages project (HTTP $code). The deploy"
            echo "itself succeeded; only the production/preview answer is missing. The"
            echo "token may have Pages Edit without Pages Read."
            exit 0
          fi
          prod="$(jq -r '.result.production_branch // ""' /tmp/proj.json)"
          envn="$(jq -r '.result.latest_deployment.environment // ""' /tmp/proj.json)"
          doms="$(jq -r '(.result.domains // []) | join(", ")' /tmp/proj.json)"
          {
            echo "PAGES_LOOKUP=ok"
            echo "PAGES_PROD_BRANCH=$prod"
            echo "PAGES_ENV=$envn"
            echo "PAGES_DOMAINS=$doms"
          } >> "$GITHUB_ENV"


      # Which URL it landed on is the whole question, so say it rather than
      # claiming success. Pages only serves the custom domain from its own
      # configured production branch; any other branch is a preview, and a
      # preview that reports "deployed" is how this went unnoticed in the
      # first place.
      - name: Say what happened
        if: always()
        run: |
          {
            echo "### subsub-app deployed from \`${{ github.sha }}\`"
            echo ""
            echo "Branch: \`${{ github.ref_name }}\`"
            echo ""
            echo "Deployment URL: ${DEPLOY_URL:-not captured}"
            echo ""
            if [ "$PAGES_LOOKUP" != "ok" ]; then
              echo "Cloudflare would not say whether this is live. Open"
              echo "app.subsub.work and check the screen you were expecting to change."
            elif [ "$PAGES_ENV" = "production" ]; then
              echo "**This is LIVE.** Pages serves its custom domains from"
              echo "\`$PAGES_PROD_BRANCH\`, which is the branch this ran on."
              echo ""
              echo "Live at: ${PAGES_DOMAINS:-app.subsub.work}"
            else
              echo "**This is a PREVIEW, not live.** app.subsub.work has not changed."
              echo ""
              echo "Pages serves its custom domains only from \`$PAGES_PROD_BRANCH\`,"
              echo "and this ran on \`${{ github.ref_name }}\`. Either set the project's"
              echo "production branch to \`${{ github.ref_name }}\` in the Cloudflare"
              echo "dashboard (Workers & Pages -> subsub-app -> Settings -> Build), or"
              echo "get this code onto \`$PAGES_PROD_BRANCH\`."
              echo ""
              echo "The preview above is still worth opening: it is this exact bundle."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
