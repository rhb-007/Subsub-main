# Deploy the API Worker (subsub-api).
#
# The frontend has had a deploy button all along: subsub-app is a Cloudflare
# Pages project wired to this repository, so Cloudflare builds it on every
# push and the dashboard offers Retry. The Worker never had one. It was only
# ever deployed by running `wrangler deploy` from a terminal, and a terminal
# is the one thing this project cannot assume. With nothing to rebuild from,
# the dashboard has nothing to offer -- which is why the API sat behind the
# app after a push, every time.
#
# This is that missing button. Two ways to press it:
#
#   * Actions tab -> "Deploy API Worker" -> Run workflow. Works from a phone.
#   * Automatically, when a push actually changes the Worker. Anything else,
#     a style tweak, a new test, this file's neighbours, is left alone.
#
# It needs two repository secrets (Settings -> Secrets and variables ->
# Actions -> New repository secret):
#
#   CLOUDFLARE_API_TOKEN   dash.cloudflare.com -> My Profile -> API Tokens ->
#                          Create Token -> use the "Edit Cloudflare Workers"
#                          template, which already carries the Workers, D1
#                          and R2 permissions this needs. Nothing wider.
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard -> Workers & Pages ->
#                          right-hand sidebar.
#
# It does not touch variables or secrets on the Worker. `keep_vars = true` in
# app/wrangler.toml means a deploy leaves what the dashboard holds alone, so
# SUPABASE_URL and the rest survive this the way they survive any deploy.
#
# It does not run D1 migrations either. Those are applied by hand in the D1
# console and the tracking table this repo would need does not exist yet, so
# automating them here would re-apply everything already applied.

name: Deploy API Worker

on:
  workflow_dispatch:
  push:
    paths:
      - "app/worker/**"
      - "app/wrangler.toml"
      - "app/package.json"
      - "app/package-lock.json"
      - ".github/workflows/deploy-api.yml"

# A newer deploy makes an older one pointless, but never cancel one that is
# already talking to Cloudflare -- a half-finished upload is worse than a
# queue.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Two different situations, and they deserve different answers.
      #
      # Pressing Run workflow is asking for a deploy, so missing credentials
      # are a failure and should say which one, here, rather than letting
      # wrangler fail later with something about authentication.
      #
      # A push is not asking for anything. If the Worker is being deployed
      # some other way, a red cross on every commit that touches it is just
      # noise that teaches you to ignore the Actions tab. So the checks below
      # still run -- they are worth having either way -- and only the upload
      # is skipped, with a note saying why.
      - name: Check the credentials are set
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ASKED_FOR: ${{ github.event_name }}
        run: |
          missing=""
          [ -n "$TOKEN" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ "$ASKED_FOR" = "workflow_dispatch" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "::notice::Not deploying:$missing not set. Linting and building anyway."

      - name: Install
        working-directory: app
        run: npm ci

      # A ReferenceError has shipped from this repository before. It costs
      # seconds here and a deploy there.
      - name: Lint
        working-directory: app
        run: npm run lint

      # Every wrangler call names its config file. Without --config, wrangler
      # run from app/ resolves to the repository root's wrangler.jsonc -- the
      # marketing site, whose assets directory is the whole repo -- and not to
      # app/wrangler.toml at all. The first run of this workflow died on a
      # 126 MiB file in node_modules for exactly that reason, which is the
      # harmless version: with credentials in hand it would have deployed the
      # wrong project instead. The repo's own npm scripts pass it too.
      - name: Check it is the API's config we are about to use
        working-directory: app
        run: |
          name=$(grep -m1 '^name' wrangler.toml | cut -d'"' -f2)
          if [ "$name" != "subsub-api" ]; then
            echo "::error::app/wrangler.toml names '$name', expected 'subsub-api'."
            exit 1
          fi
          echo "deploying $name"

      # Build the Worker without uploading it. A bundle that cannot be built
      # should never reach the point of replacing a working one.
      - name: Build it first, upload nothing
        working-directory: app
        run: npx wrangler deploy --config=./wrangler.toml --dry-run --outdir=/tmp/worker-build

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config=./wrangler.toml

      - name: Say what happened
        if: success()
        run: |
          if [ "${{ steps.creds.outputs.ready }}" = "true" ]; then
            echo "### subsub-api deployed from \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### subsub-api built and checked, not deployed"
              echo ""
              echo "The Worker lints and bundles cleanly at \`${{ github.sha }}\`."
              echo "Nothing was uploaded: \`CLOUDFLARE_API_TOKEN\` and"
              echo "\`CLOUDFLARE_ACCOUNT_ID\` are not set as repository secrets."
              echo "Add them and this becomes a one-press deploy."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
