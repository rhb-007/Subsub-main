name = "subsub-api"
main = "worker/index.js"
compatibility_date = "2026-01-01"

# Keep variables set in the Cloudflare dashboard.
#
# Without this, every deploy deletes all plain-text vars and replaces them with
# whatever this file declares -- which is none. Since the Worker rebuilds on
# every push, dashboard-set values survived only until the next commit. That is
# not theoretical: it silently wiped SUPABASE_URL and SUPABASE_ANON_KEY between
# a working check and a real signup, so the signup created an account with no
# login attached and the failure surfaced much later as "invalid login
# credentials".
#
# Secrets were never affected -- Wrangler does not touch those. This makes
# plain vars behave the same way.
keep_vars = true

# Real auth (Supabase). Deliberately NOT set here as a plain [vars] block,
# even though both values are safe to be non-secret (the anon key is meant
# to be public) — if they were always-on in this checked-in file, local
# `wrangler dev` would force every request into real-auth mode too, and
# local development / the e2e scripts (which use the dev-stub auth) would
# break. Instead:
#   - Production: set both in the Cloudflare dashboard (Worker → Settings →
#     Variables) or `wrangler secret put SUPABASE_ANON_KEY` — see app/README.md.
#   - Local, only if you want to test real auth from a machine that (unlike
#     this project's dev sandbox) can actually reach Supabase: create
#     app/.dev.vars (gitignored, wrangler loads it automatically) with:
#       SUPABASE_URL = "https://qxioxairvpbqaiottcxu.supabase.co"
#       SUPABASE_ANON_KEY = "..."
# Leaving both unset (the default) runs on the dev-stub auth — see
# app/README.md "Local development".

# Filled in after you run `wrangler d1 create subsub-db` — see app/README.md.
[[d1_databases]]
binding = "DB"
database_name = "subsub-db"
database_id = "b8874422-45db-48de-9c6b-3bc0819736cc"

# Filled in after you run `wrangler r2 bucket create subsub-files`.
[[r2_buckets]]
binding = "FILES"
bucket_name = "subsub-files"

# Nightly WA L&I license re-check (03:00 UTC). Requires CRON_SECRET to be
# set with `wrangler secret put CRON_SECRET` before this is useful.
[triggers]
crons = ["0 3 * * *"]
