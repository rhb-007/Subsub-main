<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SubSub</title>
<!--
  The app had no icons at all, so every page it serves -- app.subsub.work,
  every customer's subdomain, every sign-in and application form -- showed
  the browser's blank default. The files were only ever at the marketing
  site's root; they live in public/ now, which Vite copies verbatim into the
  build, and the paths are absolute so they resolve the same on a branded
  subdomain as on app.subsub.work.

  These are SubSub's own icons on purpose, including on a customer's
  branded page. The page carries the customer's name and colours; the tab
  says which product the tab is.
-->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#103528">
</head>
<body>
<div id="root"></div>
<!--
  The error boundary in main.tsx catches a render that throws. It cannot
  catch the app never starting: a script that fails to load, or one that
  throws while it is still being evaluated, leaves React with nothing to
  mount and this div empty forever. That is the same white screen from the
  outside and a different failure from the inside, so it needs its own net,
  and the net has to be here -- inline, before the module -- because by
  definition the module is the thing that did not run.

  It only ever draws when #root is still empty, so a slow start shows
  nothing and a normal one is untouched.
-->
<script>
(function () {
  var last = null;
  function remember(what) { if (!last) last = String(what || "").slice(0, 300); }
  window.addEventListener("error", function (e) {
    // A failed <script>/<link> fires an error event with no message on the
    // element itself, which is worth saying plainly -- it usually means a
    // half-finished deploy or a browser holding an old file.
    if (e && e.target && e.target !== window && e.target.src) {
      return remember("Could not load " + String(e.target.src).split("/").pop());
    }
    remember(e && e.message);
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    remember(e && e.reason && (e.reason.message || e.reason));
  });
  setTimeout(function () {
    var root = document.getElementById("root");
    if (!root || root.childElementCount > 0) return;   // it started; nothing to say
    root.innerHTML =
      '<div style="font:15px/1.55 Inter,system-ui,sans-serif;color:#0f172a;max-width:640px;margin:0 auto;padding:48px 20px">'
      + '<h1 style="font:700 20px/1.3 Inter,system-ui,sans-serif;margin:0 0 10px">SubSub could not start.</h1>'
      + '<p style="margin:0 0 18px;color:#475569">The page loaded but the app did not. This is not something you did. '
      + 'Send whoever looks after SubSub a picture of this screen.</p>'
      + '<pre style="background:#f1f5f9;border:1px solid #cbd5e1;border-radius:10px;padding:12px 14px;margin:0 0 20px;'
      + 'white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 ui-monospace,Menlo,monospace">'
      + (last ? last.replace(/[<&]/g, function (c) { return c === "<" ? "&lt;" : "&amp;"; })
              : "No error was reported — the app\'s code may not have finished loading.")
      + '</pre>'
      + '<button onclick="location.reload()" style="background:#103528;color:#fff;border:0;border-radius:9px;'
      + 'padding:11px 16px;font:700 14px Inter,sans-serif;cursor:pointer">Reload the page</button>'
      + '</div>';
  }, 12000);
})();
</script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
